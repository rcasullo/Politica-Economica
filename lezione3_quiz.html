      "Influenza prima il tasso di interesse e solo successivamente il reddito reale"
    ],
    explanation: "L'asimmetria di cui parla il prof è quella tra direzione restrittiva (efficace) ed espansiva (poco efficace): la politica monetaria agisce attraverso lo stimolo all'investimento, ma in fasi di recessione le imprese con capacità inutilizzata non hanno alcun incentivo a investire — 'si può portare il cavallo all'abbeveratoio ma non si può obbligarlo a bere'. La terza opzione descrive un'altra asimmetria (la dicotomia BP-LP dei monetaristi), distinta da questa."
  },
  {
    q: "Quando il prof afferma che 'la politica monetaria è tanto più efficace quanto più piatta è BP' in regime di cambi flessibili, intende che:",
    options: [
      "Con capitali perfettamente mobili (BP orizzontale) l'aggiustamento avviene tutto via cambio e ΔY è massimo; con capitali immobili (BP verticale) resta solo il debole effetto LM puro",
      "La piattezza di BP indica un mercato dei capitali poco sviluppato, e in questo caso la politica monetaria opera prevalentemente attraverso il canale del credito interno",
      "L'inclinazione di BP non incide sull'esito finale; è la posizione iniziale di BP a determinare l'efficacia della manovra",
      "Quando BP è piatta, il deprezzamento richiesto è minimo e quindi l'effetto sulle esportazioni è limitato"
    ],
    explanation: "BP piatta significa che basta una piccolissima riduzione di r per generare un grosso deflusso di capitali; per riequilibrare la BP serve un forte deprezzamento del cambio, che a sua volta sposta la IS molto a destra. Risultato: ΔY massimo. BP verticale significa nessun deflusso di capitali → nessuna pressione sul cambio → nessun effetto cambio: resta solo lo spostamento di LM. La quarta opzione inverte la logica del meccanismo del cambio."
  }
];

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let questions = [];
function buildQuestions() {
  questions = questionsRaw.map(qRaw => {
    const indexed = qRaw.options.map((opt, i) => ({ text: opt, originalIdx: i }));
    const shuffled = shuffleArray(indexed);
    const correctIdx = shuffled.findIndex(o => o.originalIdx === 0);
    return {
      q: qRaw.q,
      options: shuffled.map(o => o.text),
      correct: correctIdx,
      explanation: qRaw.explanation
    };
  });
}

let currentQuestion = 0;
let userAnswers = [];
let score = 0;

const quizArea = document.getElementById('quizArea');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const scoreText = document.getElementById('scoreText');
const results = document.getElementById('results');

function renderQuestion(idx) {
  const q = questions[idx];
  const html = `
    <div class="question active" id="q${idx}">
      <div class="q-num">Domanda ${idx + 1} di ${questions.length}</div>
      <div class="q-text">${q.q}</div>
      <ul class="options" id="options-${idx}">
        ${q.options.map((opt, i) => `
          <li class="option" data-idx="${i}" onclick="selectOption(${idx}, ${i})">
            <span class="option-letter">${String.fromCharCode(65 + i)}.</span>
            <span>${opt}</span>
          </li>
        `).join('')}
      </ul>
      <div class="feedback" id="feedback-${idx}">
        <div class="feedback-label" id="feedback-label-${idx}"></div>
        <div id="feedback-text-${idx}"></div>
      </div>
      <div class="actions">
        <button class="secondary" onclick="prevQuestion()" ${idx === 0 ? 'disabled' : ''}>← Precedente</button>
        <button id="next-btn-${idx}" onclick="nextQuestion()" disabled>${idx === questions.length - 1 ? 'Vedi risultati →' : 'Prossima →'}</button>
      </div>
    </div>
  `;
  quizArea.innerHTML = html;
  updateProgress();
  if (userAnswers[idx] !== undefined) showAnswerState(idx);
}

function selectOption(qIdx, optIdx) {
  if (userAnswers[qIdx] !== undefined) return;
  userAnswers[qIdx] = optIdx;
  if (optIdx === questions[qIdx].correct) score++;
  showAnswerState(qIdx);
  updateProgress();
}

function showAnswerState(qIdx) {
  const q = questions[qIdx];
  const userAnswer = userAnswers[qIdx];
  const options = document.querySelectorAll(`#options-${qIdx} .option`);
  options.forEach((opt, i) => {
    opt.classList.add('disabled');
    if (i === q.correct) opt.classList.add('correct');
    else if (i === userAnswer) opt.classList.add('wrong');
  });
  const feedback = document.getElementById(`feedback-${qIdx}`);
  const label = document.getElementById(`feedback-label-${qIdx}`);
  const text = document.getElementById(`feedback-text-${qIdx}`);
  const isCorrect = userAnswer === q.correct;
  feedback.classList.add('show', isCorrect ? 'correct' : 'wrong');
  label.textContent = isCorrect ? 'Risposta corretta' : 'Risposta errata';
  text.innerHTML = q.explanation;
  document.getElementById(`next-btn-${qIdx}`).disabled = false;
}

function nextQuestion() {
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    renderQuestion(currentQuestion);
  } else showResults();
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion(currentQuestion);
  }
}

function updateProgress() {
  const answered = userAnswers.filter(a => a !== undefined).length;
  progressFill.style.width = (answered / questions.length) * 100 + '%';
  progressText.textContent = `Domanda ${currentQuestion + 1} di ${questions.length}`;
  scoreText.textContent = `Risposte corrette: ${score}`;
}

function showResults() {
  quizArea.style.display = 'none';
  document.querySelector('.progress-info').style.display = 'none';
  document.querySelector('.progress-bar').style.display = 'none';
  results.classList.add('show');
  document.getElementById('finalScore').textContent = score;
  const pct = score / questions.length;
  const msg = pct === 1 ? "Risultato eccellente." :
              pct >= 0.8 ? "Buon risultato." :
              pct >= 0.6 ? "Risultato sufficiente." :
              pct >= 0.4 ? "Risultato da consolidare." :
                          "Si consiglia di rivedere le note della lezione.";
  document.getElementById('scoreMessage').textContent = msg;
  document.getElementById('reviewList').innerHTML = questions.map((q, i) => {
    const correct = userAnswers[i] === q.correct;
    return `<div class="review-item"><span class="review-mark ${correct ? 'ok' : 'no'}">${correct ? '✓' : '✗'}</span><span><strong>D${i + 1}.</strong> ${q.q}</span></div>`;
  }).join('');
}

function restartQuiz() {
  buildQuestions();
  currentQuestion = 0;
  userAnswers = [];
  score = 0;
  results.classList.remove('show');
  quizArea.style.display = 'block';
  document.querySelector('.progress-info').style.display = 'flex';
  document.querySelector('.progress-bar').style.display = 'block';
  renderQuestion(0);
}

(function() {
  const btn = document.getElementById('presToggle');
  const body = document.body;
  function setPresentation(on) {
    if (on) {
      body.classList.add('presentation');
      btn.textContent = 'Esci';
      try { sessionStorage.setItem('presMode', '1'); } catch(e) {}
    } else {
      body.classList.remove('presentation');
      btn.textContent = 'Presentazione';
      try { sessionStorage.removeItem('presMode'); } catch(e) {}
    }
  }
  try { if (sessionStorage.getItem('presMode') === '1') setPresentation(true); } catch(e) {}
  btn.addEventListener('click', () => setPresentation(!body.classList.contains('presentation')));
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      e.preventDefault();
      setPresentation(!body.classList.contains('presentation'));
    }
  });
})();

buildQuestions();
renderQuestion(0);
</script>
</body>
</html>
