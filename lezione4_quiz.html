      "dP = (1+g)·dw: il mark-up si applica direttamente all'aumento salariale"
    ],
    explanation: "Linearizzando P = (w/PMeL)(1+g) si ottiene dP = dw − dPMeL + d(1+g): l'inflazione è il risultato della differenza tra crescita salariale e crescita della produttività (CLUP), più la dinamica del mark-up. Se w cresce come la produttività, il CLUP è stabile e l'inflazione viene tutta dal mark-up. Questa formula chiarisce la logica del 'conflitto distributivo' come motore dell'inflazione."
  },
  {
    q: "Tra le politiche di rientro dal debito pubblico, una politica di austerità di tipo espansivo:",
    options: [
      "Sostiene che una contrazione fiscale credibile può stimolare la fiducia e la crescita, attraverso minori premi al rischio e aspettative di future riduzioni delle imposte",
      "Combina aumenti di imposte e tagli di spesa per ottenere effetti pro-ciclici massimi",
      "Si applica solo in regimi di cambio flessibile, dove il deprezzamento sostiene la domanda estera",
      "È un sinonimo di politica monetaria espansiva accomodante in fase di consolidamento fiscale"
    ],
    explanation: "L'austerità espansiva (Giavazzi-Pagano e altri) sostiene che, sotto certe condizioni (alto debito, alta credibilità del programma), una contrazione fiscale può paradossalmente stimolare la crescita: i premi al rischio sui titoli scendono, le famiglie anticipano riduzioni di imposte future (visione ricardiana), gli investimenti privati rispondono positivamente. È una tesi controversa: le evidenze empiriche post-2010 (Eurozona) sono state largamente sfavorevoli."
  },
  {
    q: "Le politiche commerciali protezionistiche (dazi e contingentamenti), pur a parità di effetto sul prezzo interno, si differenziano per:",
    options: [
      "Con i dazi lo stato incassa il maggior prezzo come gettito fiscale; con i contingentamenti la rendita va ai produttori interni",
      "I dazi sono permessi dall'OMC mentre i contingentamenti sono sempre vietati",
      "I dazi influiscono solo sul prezzo, mentre i contingentamenti influiscono solo sulla quantità",
      "I dazi hanno effetto solo sul commercio extra-UE; i contingentamenti su quello intra-UE"
    ],
    explanation: "L'effetto su prezzo interno, produzione interna e consumi è identico per dazi e contingentamenti. La differenza chiave è chi incassa la rendita: lo stato (entrate fiscali) con i dazi, i produttori interni (extra-profitti) con i contingentamenti. Per questo motivo i contingentamenti sono spesso preferiti politicamente dai produttori, mentre i dazi sono preferiti dai ministri delle Finanze. Entrambi sono regolati (non vietati in assoluto) dagli accordi commerciali."
  }
];

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let questions = [];
function buildQuestions() {
  questions = questionsRaw.map(qRaw => {
    const indexed = qRaw.options.map((opt, i) => ({ text: opt, originalIdx: i }));
    const shuffled = shuffleArray(indexed);
    const correctIdx = shuffled.findIndex(o => o.originalIdx === 0);
    return {
      q: qRaw.q,
      options: shuffled.map(o => o.text),
      correct: correctIdx,
      explanation: qRaw.explanation
    };
  });
}

let currentQuestion = 0;
let userAnswers = [];
let score = 0;

const quizArea = document.getElementById('quizArea');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const scoreText = document.getElementById('scoreText');
const results = document.getElementById('results');

function renderQuestion(idx) {
  const q = questions[idx];
  const html = `
    <div class="question active" id="q${idx}">
      <div class="q-num">Domanda ${idx + 1} di ${questions.length}</div>
      <div class="q-text">${q.q}</div>
      <ul class="options" id="options-${idx}">
        ${q.options.map((opt, i) => `
          <li class="option" data-idx="${i}" onclick="selectOption(${idx}, ${i})">
            <span class="option-letter">${String.fromCharCode(65 + i)}.</span>
            <span>${opt}</span>
          </li>
        `).join('')}
      </ul>
      <div class="feedback" id="feedback-${idx}">
        <div class="feedback-label" id="feedback-label-${idx}"></div>
        <div id="feedback-text-${idx}"></div>
      </div>
      <div class="actions">
        <button class="secondary" onclick="prevQuestion()" ${idx === 0 ? 'disabled' : ''}>← Precedente</button>
        <button id="next-btn-${idx}" onclick="nextQuestion()" disabled>${idx === questions.length - 1 ? 'Vedi risultati →' : 'Prossima →'}</button>
      </div>
    </div>
  `;
  quizArea.innerHTML = html;
  updateProgress();
  if (userAnswers[idx] !== undefined) showAnswerState(idx);
}

function selectOption(qIdx, optIdx) {
  if (userAnswers[qIdx] !== undefined) return;
  userAnswers[qIdx] = optIdx;
  if (optIdx === questions[qIdx].correct) score++;
  showAnswerState(qIdx);
  updateProgress();
}

function showAnswerState(qIdx) {
  const q = questions[qIdx];
  const userAnswer = userAnswers[qIdx];
  const options = document.querySelectorAll(`#options-${qIdx} .option`);
  options.forEach((opt, i) => {
    opt.classList.add('disabled');
    if (i === q.correct) opt.classList.add('correct');
    else if (i === userAnswer) opt.classList.add('wrong');
  });
  const feedback = document.getElementById(`feedback-${qIdx}`);
  const label = document.getElementById(`feedback-label-${qIdx}`);
  const text = document.getElementById(`feedback-text-${qIdx}`);
  const isCorrect = userAnswer === q.correct;
  feedback.classList.add('show', isCorrect ? 'correct' : 'wrong');
  label.textContent = isCorrect ? 'Risposta corretta' : 'Risposta errata';
  text.innerHTML = q.explanation;
  document.getElementById(`next-btn-${qIdx}`).disabled = false;
}

function nextQuestion() {
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    renderQuestion(currentQuestion);
  } else showResults();
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion(currentQuestion);
  }
}

function updateProgress() {
  const answered = userAnswers.filter(a => a !== undefined).length;
  progressFill.style.width = (answered / questions.length) * 100 + '%';
  progressText.textContent = `Domanda ${currentQuestion + 1} di ${questions.length}`;
  scoreText.textContent = `Risposte corrette: ${score}`;
}

function showResults() {
  quizArea.style.display = 'none';
  document.querySelector('.progress-info').style.display = 'none';
  document.querySelector('.progress-bar').style.display = 'none';
  results.classList.add('show');
  document.getElementById('finalScore').textContent = score;
  const pct = score / questions.length;
  const msg = pct === 1 ? "Risultato eccellente." :
              pct >= 0.8 ? "Buon risultato." :
              pct >= 0.6 ? "Risultato sufficiente." :
              pct >= 0.4 ? "Risultato da consolidare." :
                          "Si consiglia di rivedere le note della lezione.";
  document.getElementById('scoreMessage').textContent = msg;
  document.getElementById('reviewList').innerHTML = questions.map((q, i) => {
    const correct = userAnswers[i] === q.correct;
    return `<div class="review-item"><span class="review-mark ${correct ? 'ok' : 'no'}">${correct ? '✓' : '✗'}</span><span><strong>D${i + 1}.</strong> ${q.q}</span></div>`;
  }).join('');
}

function restartQuiz() {
  buildQuestions();
  currentQuestion = 0;
  userAnswers = [];
  score = 0;
  results.classList.remove('show');
  quizArea.style.display = 'block';
  document.querySelector('.progress-info').style.display = 'flex';
  document.querySelector('.progress-bar').style.display = 'block';
  renderQuestion(0);
}

(function() {
  const btn = document.getElementById('presToggle');
  const body = document.body;
  function setPresentation(on) {
    if (on) {
      body.classList.add('presentation');
      btn.textContent = 'Esci';
      try { sessionStorage.setItem('presMode', '1'); } catch(e) {}
    } else {
      body.classList.remove('presentation');
      btn.textContent = 'Presentazione';
      try { sessionStorage.removeItem('presMode'); } catch(e) {}
    }
  }
  try { if (sessionStorage.getItem('presMode') === '1') setPresentation(true); } catch(e) {}
  btn.addEventListener('click', () => setPresentation(!body.classList.contains('presentation')));
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      e.preventDefault();
      setPresentation(!body.classList.contains('presentation'));
    }
  });
})();

buildQuestions();
renderQuestion(0);
</script>
</body>
</html>
